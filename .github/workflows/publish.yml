name: brew pr-pull

on:
  pull_request_target:
    types:
      - labeled

jobs:
  pr-pull:
    if: contains(github.event.pull_request.labels.*.name, 'pr-pull')
    # Org admins: add a required-reviewer protection rule on the "pr-pull"
    # environment in repo settings so adding the pr-pull label requires a
    # maintainer approval before this write-token job runs. Unprotected
    # environments pass through, so this is safe before that's configured.
    environment: pr-pull
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@304fc86d2c26bcd269547dbcfcfb4c853e710779 # pinned to main @ 304fc86 (2026-09-15)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@304fc86d2c26bcd269547dbcfcfb4c853e710779 # pinned to main @ 304fc86 (2026-09-15)

      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: brew pr-pull --debug --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@304fc86d2c26bcd269547dbcfcfb4c853e710779 # pinned to main @ 304fc86 (2026-09-15)
        with:
          branch: main

      - name: Delete branch
        if: github.event.pull_request.head.repo.fork == false
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: git push --delete origin "$BRANCH"
